<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Admin Panel - Earn Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4kPh5Ug6OwlHvb2q9MZeMSDWYFAuVyng",
      authDomain: "adtasker-39dc5.firebaseapp.com",
      databaseURL: "https://adtasker-39dc5-default-rtdb.firebaseio.com",
      projectId: "adtasker-39dc5",
      storageBucket: "adtasker-39dc5.firebasestorage.app",
      messagingSenderId: "525142766951",
      appId: "1:525142766951:web:916509c0bb19e48216abc2",
      measurementId: "G-86453KRW0Q"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
  </script>

  <style>
    :root { --primary: #6C5CE7; --bg: #f4f6fb; --surface: #FFF; --text: #2D3436; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; }

    .header { background: linear-gradient(135deg, #4b3ee0, var(--primary)); color: #fff; padding: 25px 20px; text-align: center; font-size: 1.3rem; font-weight: 700; border-radius: 0 0 25px 25px; }
    .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }

    .tabs { display: flex; gap: 10px; margin: 20px 0; overflow-x: auto; padding-bottom: 5px; }
    .tab { flex: 1; text-align: center; padding: 12px 10px; font-weight: 700; color: #888; cursor: pointer; border-radius: 12px; background: #fff; transition: 0.3s; white-space: nowrap; }
    .tab.active { background: var(--primary); color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--surface); padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    h3 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 2px dashed #eee; padding-bottom: 10px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #444; }
    input, select, textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 0.95rem; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); background: #fff; }

    .btn { width: 100%; background: linear-gradient(135deg, var(--primary), #A29BFE); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .btn:active { transform: scale(0.98); }
    .btn-green { background: linear-gradient(135deg, #00b894, #00cec9); }
    .btn-red { background: linear-gradient(135deg, #ff7675, #d63031); }
    .btn-small { width: auto; padding: 8px 12px; font-size: 0.8rem; margin-top: 5px; }

    .wd-card { border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 15px; background: #fff; }
    .wd-head { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 8px; font-size: 0.95rem; }
    .wd-info { font-size: 0.85rem; color: #555; margin-bottom: 12px; line-height: 1.5; }
    .wd-actions { display: flex; gap: 10px; }

    .toast { position: fixed; top: -50px; left: 50%; transform: translateX(-50%); background: #2d3436; color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; transition: 0.4s; z-index: 999; }
    .toast.show { top: 20px; }
  </style>
</head>
<body>

  <div class="header"><i class="fas fa-user-shield"></i> Admin Control Panel</div>
  <div id="toast" class="toast">Saved!</div>

  <div class="container">
    <!-- Tabs Navigation -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('settings')"><i class="fas fa-cog"></i> General</div>
      <div class="tab" onclick="switchTab('withdrawals')"><i class="fas fa-wallet"></i> Payouts</div>
      <div class="tab" onclick="switchTab('ads')"><i class="fas fa-ad"></i> Ads & Tasks</div>
    </div>

    <!-- GENERAL SETTINGS TAB -->
    <div id="tab-settings" class="tab-content active">
      <div class="card">
        <h3><i class="fas fa-robot"></i> App Details</h3>
        <div class="form-group"><label>Bot Username (Without @)</label><input type="text" id="botUsername" placeholder="your_bot"></div>
        <div class="form-group"><label>Currency Symbol</label><input type="text" id="currencySymbol" placeholder="TK"></div>
      </div>

      <div class="card">
        <h3><i class="fas fa-gift"></i> Referral & Bonus</h3>
        <div class="form-group"><label>Daily Login Bonus (Amount)</label><input type="number" id="dailyBonusAmount" placeholder="20"></div>
        <div class="form-group"><label>Bonus Per Referral</label><input type="number" id="refBonus" placeholder="5"></div>
        <div class="form-group"><label>Tutorial Video Link (YouTube)</label><input type="text" id="tutorialLink" placeholder="https://youtube.com/..."></div>
        <div class="form-group"><label>Support Group/Channel Link</label><input type="text" id="supportLink" placeholder="https://t.me/..."></div>
      </div>

      <div class="card">
        <h3><i class="fas fa-money-bill-wave"></i> Withdrawal System</h3>
        <div class="form-group"><label>Minimum Withdraw Amount</label><input type="number" id="minWithdraw" placeholder="10"></div>
        <div class="form-group"><label>Withdraw Notice Text</label><textarea id="withdrawNotice" rows="2" placeholder="Payment within 24 hours"></textarea></div>
        <div class="form-group"><label>Payment Methods (Comma separated)</label><input type="text" id="paymentMethods" placeholder="Bkash, Nagad, Binance"></div>
      </div>

      <button class="btn" onclick="saveSettings()"><i class="fas fa-save"></i> Save General Settings</button>
    </div>

    <!-- PAYOUTS TAB -->
    <div id="tab-withdrawals" class="tab-content">
      <div class="card">
        <h3><i class="fas fa-clock"></i> Pending Withdrawals</h3>
        <div id="withdrawalList">Loading requests...</div>
      </div>
    </div>

    <!-- ADS & TASKS TAB -->
    <div id="tab-ads" class="tab-content">
      <div class="card">
        <h3><i class="fas fa-play-circle"></i> Adsgram Direct Ads Configuration</h3>
        <div class="form-group"><label>Block ID (Direct Ads Block)</label><input type="text" id="adsgramBlockId" placeholder="1234"></div>
        <div class="form-group"><label>Ad Reward Points</label><input type="number" id="adReward" placeholder="10"></div>
        <div class="form-group"><label>Daily Max Ads Limit</label><input type="number" id="dailyAdLimit" placeholder="10"></div>
        <button class="btn" onclick="saveAdsConfig()"><i class="fas fa-save"></i> Save Ads Config</button>
      </div>

      <div class="card">
        <h3><i class="fas fa-tasks"></i> Channel Join Tasks</h3>
        <div class="form-group"><label>Channel/Group Username (with @)</label><input type="text" id="taskChannel" placeholder="@yourchannel"></div>
        <div class="form-group"><label>Task Reward Points</label><input type="number" id="taskReward" placeholder="50"></div>
        <button class="btn btn-green" onclick="saveTaskConfig()"><i class="fas fa-plus"></i> Update Task</button>
      </div>
    </div>
  </div>

  <script>
    const db = firebase.database();

    // Tab Switcher Logic
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(tabName === 'settings') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('tab-settings').classList.add('active');
      } else if(tabName === 'withdrawals') {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('tab-withdrawals').classList.add('active');
        loadWithdrawals();
      } else if(tabName === 'ads') {
        document.querySelectorAll('.tab')[2].classList.add('active');
        document.getElementById('tab-ads').classList.add('active');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Load Settings
    db.ref('settings').on('value', snap => {
      const data = snap.val() || {};
      document.getElementById('botUsername').value = data.botUsername || '';
      document.getElementById('currencySymbol').value = data.currencySymbol || 'TK';
      document.getElementById('dailyBonusAmount').value = data.dailyBonus || 20;
      document.getElementById('refBonus').value = data.refBonus || 5;
      document.getElementById('tutorialLink').value = data.tutorialLink || '';
      document.getElementById('supportLink').value = data.supportLink || '';
      document.getElementById('minWithdraw').value = data.minWithdraw || 10;
      document.getElementById('withdrawNotice').value = data.withdrawNotice || '';
      document.getElementById('paymentMethods').value = data.paymentMethods || 'Bkash, Nagad';
      document.getElementById('adsgramBlockId').value = data.adsgramBlockId || '';
      document.getElementById('adReward').value = data.adReward || 10;
      document.getElementById('dailyAdLimit').value = data.dailyAdLimit || 10;
      document.getElementById('taskChannel').value = data.taskChannel || '';
      document.getElementById('taskReward').value = data.taskReward || 50;
    });

    function saveSettings() {
      db.ref('settings').update({
        botUsername: document.getElementById('botUsername').value,
        currencySymbol: document.getElementById('currencySymbol').value,
        dailyBonus: Number(document.getElementById('dailyBonusAmount').value),
        refBonus: Number(document.getElementById('refBonus').value),
        tutorialLink: document.getElementById('tutorialLink').value,
        supportLink: document.getElementById('supportLink').value,
        minWithdraw: Number(document.getElementById('minWithdraw').value),
        withdrawNotice: document.getElementById('withdrawNotice').value,
        paymentMethods: document.getElementById('paymentMethods').value
      }).then(() => showToast('General Settings Saved!'));
    }

    function saveAdsConfig() {
      db.ref('settings').update({
        adsgramBlockId: document.getElementById('adsgramBlockId').value,
        adReward: Number(document.getElementById('adReward').value),
        dailyAdLimit: Number(document.getElementById('dailyAdLimit').value)
      }).then(() => showToast('Ads Config Saved!'));
    }

    function saveTaskConfig() {
      db.ref('settings').update({
        taskChannel: document.getElementById('taskChannel').value,
        taskReward: Number(document.getElementById('taskReward').value)
      }).then(() => showToast('Task Config Saved!'));
    }

    // Load Withdrawals
    function loadWithdrawals() {
      db.ref('withdrawals').on('value', snap => {
        const list = document.getElementById('withdrawalList');
        list.innerHTML = '';
        if(!snap.exists()) {
          list.innerHTML = '<p style="text-align:center;color:#888;">No pending requests</p>';
          return;
        }
        snap.forEach(child => {
          const req = child.val();
          if(req.status === 'pending') {
            list.innerHTML += `
              <div class="wd-card">
                <div class="wd-head">
                  <span>${req.method}</span>
                  <span style="color:var(--primary);">${req.amount} ${document.getElementById('currencySymbol').value}</span>
                </div>
                <div class="wd-info">
                  <b>User ID:</b> ${req.userId}<br>
                  <b>Account:</b> ${req.number}<br>
                  <b>Date:</b> ${req.date || 'N/A'}
                </div>
                <div class="wd-actions">
                  <button class="btn btn-green btn-small" onclick="approveWd('${child.key}')">Approve</button>
                  <button class="btn btn-red btn-small" onclick="rejectWd('${child.key}', '${req.userId}', ${req.amount})">Reject</button>
                </div>
              </div>
            `;
          }
        });
      });
    }

    function approveWd(key) {
      db.ref('withdrawals/' + key).update({ status: 'approved' })
        .then(() => showToast('Withdrawal Approved!'));
    }

    function rejectWd(key, userId, amount) {
      db.ref('withdrawals/' + key).update({ status: 'rejected' }).then(() => {
        db.ref('users/' + userId + '/balance').transaction(curr => (curr || 0) + amount);
        showToast('Rejected & Refunded!');
      });
    }
  </script>
</body>
</html>
