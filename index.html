<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AdTasker - Telegram Mini App</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #6C5CE7;
      --primary-dark: #5A4AD1;
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #FFFFFF;
      --text-dim: #A0A0B0;
      --accent: #00FF88;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0c20; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 70px; }

    #loading-screen { position: fixed; inset: 0; background: #0f0c20; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .loader { width: 50px; height: 50px; border: 4px solid var(--card-border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--card-border); }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .user-info h4 { font-size: 0.95rem; }
    .user-info p { font-size: 0.75rem; color: var(--text-dim); }

    .balance-card { margin: 20px; padding: 25px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3); }
    .balance-title { font-size: 0.85rem; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; }
    .balance-amount { font-size: 2.5rem; font-weight: 800; margin: 10px 0; }

    .main-content { padding: 0 20px; }
    .nav-tab { display: none; }
    .nav-tab.active { display: block; }

    .btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: rgba(15, 12, 32, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); text-decoration: none; font-size: 0.75rem; cursor: pointer; }
    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--primary); }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; margin-bottom: 15px; }
    input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: #fff; margin-top: 8px; margin-bottom: 15px; outline: none; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loader"></div>
    <p style="margin-top: 15px; color: var(--text-dim); font-size: 0.9rem;">লোডিং হচ্ছে...</p>
  </div>

  <div>
    <div class="header">
      <div class="user-profile">
        <div class="avatar" id="u-avatar">U</div>
        <div class="user-info">
          <h4 id="u-name">User</h4>
          <p id="u-id">ID: 000000</p>
        </div>
      </div>
    </div>

    <div class="balance-card">
      <div class="balance-title">Current Balance</div>
      <div class="balance-amount"><span id="u-balance">0</span> <small id="curr-sym" style="font-size: 1rem;">TK</small></div>
    </div>

    <div class="main-content">
      <!-- HOME TAB -->
      <div id="tab-home" class="nav-tab active">
        <button class="btn" onclick="claimDailyBonus()"><i class="fas fa-gift"></i> Daily Bonus</button>
        <button class="btn" style="background: #00b894;" onclick="showAdsgramAd()"><i class="fas fa-play"></i> Watch Ad & Earn</button>
      </div>

      <!-- TASKS TAB -->
      <div id="tab-tasks" class="nav-tab">
        <div class="card">
          <h3 style="margin-bottom: 10px;"><i class="fas fa-tasks"></i> Channel Task</h3>
          <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 12px;" id="task-desc">Join Telegram Channel</p>
          <button class="btn" onclick="completeTask()">Join & Claim</button>
        </div>
      </div>

      <!-- WITHDRAW TAB -->
      <div id="tab-withdraw" class="nav-tab">
        <div class="card">
          <h3>Withdraw Money</h3>
          <p style="font-size:0.8rem; color:var(--text-dim); margin-top:5px;" id="wd-notice">Min withdraw: 10 TK</p>
          <label style="font-size:0.85rem; display:block; margin-top:15px;">Payment Method</label>
          <select id="wd-method"></select>
          <label style="font-size:0.85rem; display:block;">Account Number</label>
          <input type="text" id="wd-number" placeholder="017xxxxxxxx">
          <label style="font-size:0.85rem; display:block;">Amount</label>
          <input type="number" id="wd-amount" placeholder="10">
          <button class="btn" onclick="submitWithdraw()">Request Withdraw</button>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" onclick="switchNav('home', this)"><i class="fas fa-home"></i>Home</div>
    <div class="nav-item" onclick="switchNav('tasks', this)"><i class="fas fa-tasks"></i>Tasks</div>
    <div class="nav-item" onclick="switchNav('withdraw', this)"><i class="fas fa-wallet"></i>Withdraw</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4kPh5Ug6OwlHvb2q9MZeMSDWYFAuVyng",
      authDomain: "adtasker-39dc5.firebaseapp.com",
      databaseURL: "https://adtasker-39dc5-default-rtdb.firebaseio.com",
      projectId: "adtasker-39dc5",
      storageBucket: "adtasker-39dc5.firebasestorage.app",
      messagingSenderId: "525142766951",
      appId: "1:525142766951:web:916509c0bb19e48216abc2",
      measurementId: "G-86453KRW0Q"
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let tgUser = { id: "1234567", first_name: "Test User" };
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe.user) {
      tgUser = window.Telegram.WebApp.initDataUnsafe.user;
      window.Telegram.WebApp.expand();
    }

    document.getElementById('u-name').innerText = tgUser.first_name;
    document.getElementById('u-id').innerText = "ID: " + tgUser.id;
    document.getElementById('u-avatar').innerText = tgUser.first_name.charAt(0);

    let appSettings = {};

    // Load Settings
    db.ref('settings').on('value', snap => {
      appSettings = snap.val() || {};
      document.getElementById('curr-sym').innerText = appSettings.currencySymbol || 'TK';
      document.getElementById('wd-notice').innerText = appSettings.withdrawNotice || ('Minimum Withdraw: ' + (appSettings.minWithdraw || 10));
      
      const methods = (appSettings.paymentMethods || 'Bkash, Nagad').split(',');
      const select = document.getElementById('wd-method');
      select.innerHTML = '';
      methods.forEach(m => {
        select.innerHTML += `<option value="${m.trim()}">${m.trim()}</option>`;
      });

      if(appSettings.taskChannel) {
        document.getElementById('task-desc').innerText = `Join ${appSettings.taskChannel} & get ${appSettings.taskReward || 50} bonus!`;
      }
    });

    // Load User Data
    db.ref('users/' + tgUser.id).on('value', snap => {
      let data = snap.val();
      if (!data) {
        db.ref('users/' + tgUser.id).set({
          name: tgUser.first_name,
          balance: 0,
          lastBonus: ""
        });
        document.getElementById('u-balance').innerText = "0";
      } else {
        document.getElementById('u-balance').innerText = data.balance || 0;
      }
      document.getElementById('loading-screen').style.display = 'none';
    }, err => {
      document.getElementById('loading-screen').style.display = 'none';
    });

    function switchNav(tab, el) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      el.classList.add('active');
    }

    function claimDailyBonus() {
      const today = new Date().toDateString();
      db.ref('users/' + tgUser.id).once('value', snap => {
        const u = snap.val() || {};
        if (u.lastBonus === today) {
          alert('আজকের বোনাস ইতোমধ্যে পেয়ে গেছেন!');
        } else {
          const reward = appSettings.dailyBonus || 20;
          db.ref('users/' + tgUser.id).update({
            balance: (u.balance || 0) + reward,
            lastBonus: today
          });
          alert(`অভিনন্দন! ${reward} পয়েন্ট ডেইলি বোনাস পেয়েছেন!`);
        }
      });
    }

    function showAdsgramAd() {
      if(!appSettings.adsgramBlockId) {
        alert('অ্যাড অপশন প্রস্তুত নয়।');
        return;
      }
      const AdController = window.Adsgram.init({ blockId: appSettings.adsgramBlockId });
      AdController.show().then((result) => {
        const reward = appSettings.adReward || 10;
        db.ref('users/' + tgUser.id + '/balance').transaction(curr => (curr || 0) + reward);
        alert(`অ্যাড দেখার জন্য ${reward} পয়েন্ট যোগ করা হয়েছে!`);
      }).catch((result) => {
        alert('অ্যাড দেখতে সমস্যা হয়েছে। পরবর্তীতে চেষ্টা করুন।');
      });
    }

    function completeTask() {
      if(!appSettings.taskChannel) return;
      window.open('https://t.me/' + appSettings.taskChannel.replace('@',''), '_blank');
      const reward = appSettings.taskReward || 50;
      db.ref('users/' + tgUser.id + '/balance').transaction(curr => (curr || 0) + reward);
      alert('টাস্ক বোনাস যুক্ত করা হয়েছে!');
    }

    function submitWithdraw() {
      const method = document.getElementById('wd-method').value;
      const num = document.getElementById('wd-number').value;
      const amt = Number(document.getElementById('wd-amount').value);
      const min = appSettings.minWithdraw || 10;

      if(!num || amt < min) {
        alert(`কমপক্ষে ${min} পরিমাণ নির্বাচন করুন।`);
        return;
      }

      db.ref('users/' + tgUser.id).once('value', snap => {
        const u = snap.val() || {};
        if((u.balance || 0) < amt) {
          alert('পর্যাপ্ত ব্যালেন্স নেই!');
          return;
        }

        db.ref('users/' + tgUser.id + '/balance').transaction(curr => curr - amt);
        db.ref('withdrawals').push({
          userId: tgUser.id,
          method: method,
          number: num,
          amount: amt,
          status: 'pending',
          date: new Date().toLocaleDateString()
        });

        alert('উইথড্র রিকোয়েস্ট জমা হয়েছে!');
      });
    }
  </script>
</body>
</html>
